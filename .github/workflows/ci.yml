name: Web Portal CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Lint check
        run: npm run lint

      - name: Build check
        env:
          VITE_API_BASE_URL: ""
        run: npm run build

      - name: Confirm build output
        run: |
          ls dist/
          echo "Build successful"